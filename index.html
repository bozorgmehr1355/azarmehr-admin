  name:"", legal_type:"individual", grade:"standard", national_id:"",
  company_national_id:"", economic_code:"", ceo_name:"", phone:"", email:"",
  whatsapp:"", eitaa_id:"", province:"", city:"", address:"", postal_code:"",
  bank_name:"", bank_account:"", sheba:"", payment_terms:"نقد", credit_limit:0,
  credit_allowed:false, credit_days:30,
  min_order_qty:1, inquiry_threshold:100, internal_note:"",
  portal_username:"", portal_password:"", portal_active:false
};

function CustomerForm({ customer, onSave, onCancel, showToast }) {
  const [form, setForm] = useState(customer ? {...customer} : {...EMPTY_CUST});
  const [saving, setSaving] = useState(false);
  const upd = (k,v) => setForm(f => ({...f,[k]:v}));
  const inp = (k, label, opts={}) => (
    <Fld label={label}>
      <input style={iStyle} value={form[k]||""} onChange={e=>upd(k,e.target.value)} {...opts} />
    </Fld>
  );

  const save = async () => {
    if (!form.name||!form.phone) { showToast("نام و تلفن الزامی است","error"); return; }
    setSaving(true);
    try {
      if (customer) { await api("PATCH",`crm_customers?id=eq.${customer.id}`,form); showToast("مشتری بروز شد"); }
      else { await api("POST","crm_customers",{...form,created_at:new Date().toISOString()}); showToast("مشتری ایجاد شد"); }
      onSave();
    } catch { showToast("خطا در ذخیره","error"); }
    finally { setSaving(false); }
  };

  return (
    <Modal title={customer?"ویرایش مشتری":"مشتری جدید"} onClose={onCancel} maxWidth={680}>
      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        {[["individual","حقیقی"],["corporate","حقوقی"]].map(([v,l]) => (
          <button key={v} onClick={() => upd("legal_type",v)} style={{
            flex:1, padding:"8px", borderRadius:8, cursor:"pointer", fontFamily:FF, fontSize:13,
            border:`2px solid ${form.legal_type===v?C.primary:C.border}`,
            background:form.legal_type===v?C.primaryDim:C.surfaceAlt, color:C.text
          }}>{l}</button>
        ))}
      </div>
      {inp("name","نام شرکت / مشتری *")}
      {form.legal_type==="individual" ? inp("national_id","کد ملی") : (
        <>{inp("company_national_id","شناسه ملی شرکت")}{inp("economic_code","کد اقتصادی")}{inp("ceo_name","نام مدیرعامل")}</>
      )}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        {inp("phone","تلفن *")} {inp("email","ایمیل")}
        {inp("whatsapp","واتساپ")} {inp("eitaa_id","ایتا")}
        {inp("province","استان")} {inp("city","شهر")}
      </div>
      <Fld label="آدرس کامل">
        <textarea style={{ ...iStyle, resize:"none" }} rows={2} value={form.address||""} onChange={e=>upd("address",e.target.value)} />
      </Fld>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <Fld label="سطح مشتری">
          <select style={{ ...iStyle, cursor:"pointer" }} value={form.grade} onChange={e=>upd("grade",e.target.value)}>
            <option value="standard">معمولی</option><option value="silver">نقره‌ای</option>
            <option value="gold">طلایی</option><option value="vip">VIP</option>
          </select>
        </Fld>
        <Fld label="شرایط پرداخت">
          <select style={{ ...iStyle, cursor:"pointer" }} value={form.payment_terms} onChange={e=>upd("payment_terms",e.target.value)}>
            <option value="نقد">نقد</option><option value="7 روزه">۷ روزه</option>
            <option value="14 روزه">۱۴ روزه</option><option value="30 روزه">۳۰ روزه</option><option value="چک">چک</option>
          </select>
        </Fld>
        {inp("bank_name","نام بانک")} {inp("sheba","شبا (IR...)")}
        {inp("min_order_qty","حداقل سفارش (کارتن)",{type:"number"})}
        {inp("inquiry_threshold","آستانه استعلام (کارتن)",{type:"number"})}
      </div>
      {/* ── اعتبار مشتری ── */}
      <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:14, marginTop:6 }}>
        <p style={{ fontSize:11, color:C.textMuted, marginBottom:10, fontWeight:600 }}>وضعیت اعتباری</p>
        <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13, color:C.text, marginBottom:10 }}>
          <input type="checkbox" checked={form.credit_allowed||false} onChange={e=>upd("credit_allowed",e.target.checked)} />
          مشتری دارای اعتبار است (پرداخت بعد از ارسال)
        </label>
        {form.credit_allowed && (
          <Fld label="مهلت اعتبار (روز)">
            <input style={{ ...iStyle, maxWidth:180 }} type="number" min={1} max={180}
              value={form.credit_days||30} onChange={e=>upd("credit_days",parseInt(e.target.value)||30)} />
          </Fld>
        )}
      </div>
      <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:14, marginTop:6 }}>
        <p style={{ fontSize:11, color:C.textMuted, marginBottom:10, fontWeight:600 }}>دسترسی پورتال مشتری</p>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          {inp("portal_username","نام کاربری پورتال")} {inp("portal_password","رمز پورتال",{type:"text"})}
        </div>
        <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13, color:C.text }}>
          <input type="checkbox" checked={form.portal_active||false} onChange={e=>upd("portal_active",e.target.checked)} />
          دسترسی پورتال فعال باشد
        </label>
      </div>
      <Fld label="یادداشت داخلی">
        <textarea style={{ ...iStyle, resize:"none" }} rows={2} value={form.internal_note||""} onChange={e=>upd("internal_note",e.target.value)} />
      </Fld>
      <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:8 }}>
        <Btn label="انصراف" onClick={onCancel} outline />
        <Btn label={saving?"در حال ذخیره...":"ذخیره"} icon="check" onClick={save} disabled={saving} />
      </div>
    </Modal>
  );
}

function OrderDetail({ order, customer, me, showToast, onUpdate, onClose }) {
  const [items, setItems]         = useState([]);
  const [log, setLog]             = useState([]);
  const [loading, setLoading]     = useState(true);
  const [trackCode, setTrackCode] = useState(order.tracking_code||"");
  const [note, setNote]           = useState("");
  const [orderType, setOrderType] = useState(order.order_type||"stock");
  const [payMethod, setPayMethod] = useState(order.payment_method||"cash");
  const [checkNum, setCheckNum]   = useState("");
  const [checkBank, setCheckBank] = useState("");
  const [checkDate, setCheckDate] = useState("");
  const [saving, setSaving]       = useState(false);

  const isAdmin = me?.role==="super_admin" || me?.role==="admin";
  const creditAllowed = customer?.credit_allowed === true;

  useEffect(() => {
    (async () => {
      try {
        const [its, logs] = await Promise.all([
          api("GET",`crm_order_items?order_id=eq.${order.id}`),
          api("GET",`crm_order_status_log?order_id=eq.${order.id}&order=created_at.asc`)
        ]);
        setItems(its||[]); setLog(logs||[]);
      } catch { showToast("خطا","error"); }
      finally { setLoading(false); }
    })();
  },[]);

  /* ── چرخه هوشمند بر اساس نوع سفارش و اعتبار مشتری ── */
  const getNextAction = (status, type, credit) => {
    const STOCK = {
      registered:        { label:"شروع بررسی موجودی",       next:"stock_check" },
      stock_check:       { label:"صدور پیش‌فاکتور",         next:"proforma_issued" },
      proforma_issued:   credit
        ? { label:"تأیید — ارسال (اعتباری)",               next:"ready_to_ship" }
        : { label:"ثبت درخواست پرداخت",                    next:"pending_payment" },
      pending_payment:   { label:"تأیید پرداخت",            next:"payment_confirmed" },
      payment_confirmed: { label:"آماده ارسال",              next:"ready_to_ship" },
      ready_to_ship:     { label:"ثبت کد رهگیری و ارسال",   next:"shipped" },
      shipped:           { label:"تأیید تحویل",              next:"delivered" },
    };
    const CUSTOM = {
      registered:        { label:"شروع بررسی",              next:"stock_check" },
      stock_check:       { label:"صدور پیش‌فاکتور",         next:"proforma_issued" },
      proforma_issued:   { label:"ارجاع به انعقاد قرارداد", next:"contract_pending" },
      contract_pending:  { label:"تأیید امضای قرارداد",     next:"contract_signed" },
      contract_signed:   { label:"ارجاع به واحد تولید",     next:"in_production" },
      in_production:     credit
        ? { label:"پایان تولید — ارسال (اعتباری)",         next:"ready_to_ship" }
        : { label:"پایان تولید — درخواست پرداخت",          next:"pending_payment" },
      pending_payment:   { label:"تأیید پرداخت",            next:"payment_confirmed" },
      payment_confirmed: { label:"آماده ارسال",              next:"ready_to_ship" },
      ready_to_ship:     { label:"ثبت کد رهگیری و ارسال",   next:"shipped" },
      shipped:           { label:"تأیید تحویل",              next:"delivered" },
    };
    return (type==="custom" ? CUSTOM : STOCK)[status];
  };

  const act = getNextAction(order.order_status, orderType, creditAllowed);

  const changeStatus = async (next) => {
    if (next==="shipped" && !trackCode) { showToast("کد رهگیری را وارد کنید","error"); return; }
    if (next==="payment_confirmed" && payMethod==="check" && !checkNum) { showToast("شماره چک را وارد کنید","error"); return; }
    setSaving(true);
    try {
      const patch = { order_status:next, updated_at:new Date().toISOString(), order_type:orderType };
      if (next==="shipped") patch.tracking_code = trackCode;
      if (next==="payment_confirmed") {
        patch.payment_method = payMethod;
        if (payMethod==="check") { patch.check_number=checkNum; patch.check_bank=checkBank; patch.check_due_date=checkDate; }
      }
      await api("PATCH",`crm_orders?id=eq.${order.id}`, patch);
      await api("POST","crm_order_status_log",{
        order_id:order.id, from_status:order.order_status, to_status:next,
        changed_by:me.id, note:note||null, created_at:new Date().toISOString()
      });
      showToast("وضعیت بروز شد"); onUpdate(); onClose();
    } catch { showToast("خطا","error"); }
    finally { setSaving(false); }
  };

  if (loading) return <Modal title="جزئیات سفارش" onClose={onClose}><Spinner /></Modal>;

  /* نرخ تخفیف بر اساس حجم */
  const totalQty = items.reduce((s,i)=>s+(i.quantity||0),0);
  const discount = getTierDiscount(totalQty);
  const tier = PRICE_TIERS.find(t => totalQty >= t.min && totalQty <= t.max);

  return (
    <Modal title={`سفارش #${fa(order.id)}`} onClose={onClose} maxWidth={860}>
      {/* Header info */}
      <div style={{ display:"flex", gap:10, marginBottom:16, flexWrap:"wrap" }}>
        <div style={{ flex:1, minWidth:180, padding:14, background:C.surfaceAlt, borderRadius:10 }}>
          <p style={{ fontSize:11, color:C.textMuted, marginBottom:5, fontWeight:600 }}>مشتری</p>
          <p style={{ fontSize:14, fontWeight:600, marginBottom:3 }}>{customer?.name||"—"}</p>
          <div style={{ display:"flex", gap:10, fontSize:11, color:C.textMuted }}>
            {customer?.phone && <span>📞 {fa(customer.phone)}</span>}
            {creditAllowed && <span style={{ color:C.success }}>✓ اعتباری</span>}
          </div>
        </div>
        <div style={{ padding:14, background:C.surfaceAlt, borderRadius:10 }}>
          <p style={{ fontSize:11, color:C.textMuted, marginBottom:5, fontWeight:600 }}>وضعیت</p>
          <Tag status={order.order_status} />
        </div>
        <div style={{ padding:14, background:C.surfaceAlt, borderRadius:10 }}>
          <p style={{ fontSize:11, color:C.textMuted, marginBottom:5, fontWeight:600 }}>نوع سفارش</p>
          {isAdmin && order.order_status === "registered" ? (
            <div style={{ display:"flex", gap:6 }}>
              {[["stock","موجودی انبار"],["custom","سفارشی/تولیدی"]].map(([v,l]) => (
                <button key={v} onClick={() => setOrderType(v)} style={{
                  padding:"4px 10px", borderRadius:6, border:`1.5px solid ${orderType===v?C.primary:C.border}`,
                  background:orderType===v?C.primaryDim:"transparent", color:orderType===v?C.primary:C.textMuted,
                  cursor:"pointer", fontFamily:FF, fontSize:11
                }}>{l}</button>
              ))}
            </div>
          ) : (
            <span style={{ fontSize:13, fontWeight:600, color:orderType==="custom"?C.purple:C.teal }}>
              {orderType==="custom"?"سفارشی / تولیدی":"موجودی انبار"}
            </span>
          )}
        </div>
        <div style={{ padding:14, background:C.primaryDim, borderRadius:10 }}>
          <p style={{ fontSize:11, color:C.textMuted, marginBottom:5, fontWeight:600 }}>مبلغ کل</p>
          <p style={{ fontSize:15, fontWeight:700, color:C.primary }}>{cur(order.total_amount)}</p>
          {discount > 0 && <p style={{ fontSize:10, color:C.success }}>تخفیف حجمی {fa(discount)}٪ اعمال شد</p>}
        </div>
      </div>

      {/* تخفیف حجمی */}
      {totalQty > 0 && (
        <div style={{ marginBottom:14, padding:"8px 14px", background:C.successDim, border:`1px solid ${C.success}22`, borderRadius:8, display:"flex", alignItems:"center", gap:8, fontSize:12 }}>
          <Ic name="package" size={14} color={C.success} />
          <span style={{ color:C.success, fontWeight:600 }}>حجم سفارش: {fa(totalQty)} کارتن</span>
          <span style={{ color:C.textMuted }}>—</span>
          <span style={{ color:C.text }}>{tier ? `${tier.label}: ${tier.note}` : ""}</span>
        </div>
      )}

      {/* آیتم‌ها */}
      <table style={{ width:"100%", borderCollapse:"collapse", marginBottom:16 }}>
        <thead>
          <tr style={{ borderBottom:`1px solid ${C.border}` }}>
            {["محصول","تعداد (کارتن)","قیمت واحد","تخفیف حجمی","جمع"].map(h=>(
              <th key={h} style={{ padding:"8px 10px", textAlign:"right", fontSize:11, color:C.textDim, fontWeight:600 }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {items.length===0 ? (
            <tr><td colSpan={5} style={{ padding:20, textAlign:"center", color:C.textDim, fontSize:12 }}>آیتمی ثبت نشده</td></tr>
          ) : items.map((it,i) => {
            const d = getTierDiscount(it.quantity||0);
            return (
              <tr key={i} style={{ borderBottom:`1px solid ${C.border}` }}>
                <td style={{ padding:"9px 10px", fontSize:13 }}>{it.product_name}</td>
                <td style={{ padding:"9px 10px", fontSize:13 }}>{fa(it.quantity)}</td>
                <td style={{ padding:"9px 10px", fontSize:13 }}>{cur(it.unit_price)}</td>
                <td style={{ padding:"9px 10px", fontSize:12, color: d>0?C.success:C.textDim }}>{d>0?`${fa(d)}٪`:"—"}</td>
                <td style={{ padding:"9px 10px", fontSize:13, fontWeight:600 }}>{cur(it.line_total)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>

      {/* تاریخچه */}
      {log.length > 0 && (
        <div style={{ marginBottom:16 }}>
          <p style={{ fontSize:12, color:C.textMuted, marginBottom:8, fontWeight:600 }}>تاریخچه وضعیت</p>
          <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
            {log.map((l,i) => (
              <div key={i} style={{ padding:"7px 12px", background:C.surfaceAlt, borderRadius:8, fontSize:12 }}>
                <Tag status={l.from_status} /> <span style={{ color:C.textDim, margin:"0 6px" }}>←</span> <Tag status={l.to_status} />
                <span style={{ color:C.textDim, marginRight:10 }}>{new Date(l.created_at).toLocaleString("fa-IR")}</span>
                {l.note && <span style={{ color:C.textMuted }}>— {l.note}</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* اقدام بعدی */}
      {isAdmin && act && (
        <div style={{ borderTop:`1px solid ${C.border}`, paddingTop:16, marginBottom:12 }}>
          <p style={{ fontSize:12, color:C.textMuted, marginBottom:12, fontWeight:600 }}>اقدام بعدی</p>

          {act.next==="shipped" && (
            <Fld label="کد رهگیری (اجباری)">
              <input style={iStyle} value={trackCode} onChange={e=>setTrackCode(e.target.value)} placeholder="کد پستی یا باربری..." />
            </Fld>
          )}

          {act.next==="payment_confirmed" && (
            <div>
              <Fld label="روش پرداخت">
                <div style={{ display:"flex", gap:8 }}>
                  {[["cash","نقد / کارت"],["check","چک"]].map(([v,l]) => (
                    <button key={v} onClick={() => setPayMethod(v)} style={{
                      flex:1, padding:"8px", borderRadius:8, cursor:"pointer", fontFamily:FF, fontSize:13,
                      border:`2px solid ${payMethod===v?C.primary:C.border}`,
                      background:payMethod===v?C.primaryDim:"transparent", color:payMethod===v?C.primary:C.textMuted
                    }}>{l}</button>
                  ))}
                </div>
              </Fld>
              {payMethod==="check" && (
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10 }}>
                  <Fld label="شماره چک *">
                    <input style={iStyle} value={checkNum} onChange={e=>setCheckNum(e.target.value)} />
                  </Fld>
                  <Fld label="بانک صادرکننده">
                    <input style={iStyle} value={checkBank} onChange={e=>setCheckBank(e.target.value)} />
                  </Fld>
                  <Fld label="تاریخ سررسید">
                    <JalaliPicker value={checkDate} onChange={setCheckDate} placeholder="انتخاب تاریخ سررسید" />
                  </Fld>
                </div>
              )}
            </div>
          )}

          <Fld label="یادداشت (اختیاری)">
            <textarea style={{ ...iStyle, resize:"none" }} rows={2} value={note} onChange={e=>setNote(e.target.value)} />
          </Fld>
          <Btn label={saving?"...":act.label} full icon="check" onClick={() => changeStatus(act.next)} disabled={saving} />
          {order.order_status !== "cancelled" && order.order_status !== "delivered" && (
            <div style={{ marginTop:8 }}>
              <Btn label="لغو سفارش" full icon="x" danger onClick={() => changeStatus("cancelled")} />
            </div>
          )}
        </div>
      )}

      {order.order_status === "proforma_issued" && (
        <ProformaStatusBadge
          orderId={order.id} order={order} customer={customer} items={items} showToast={showToast}
        />
      )}
      <div style={{ display:"flex", gap:8 }}>
        {order.order_status !== "proforma_issued" && (
          <InvoiceBtn orderId={order.id} order={order} customer={customer} items={items} type="proforma" showToast={showToast} />
        )}
        <InvoiceBtn orderId={order.id} order={order} customer={customer} items={items} type="official" showToast={showToast} />
      </div>
    </Modal>
  );
}

function CRMModule({ me, showToast }) {
  const [customers, setCustomers] = useState([]);
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("customers");
  const [showForm, setShowForm] = useState(false);
  const [editCust, setEditCust] = useState(null);
  const [detailOrder, setDetailOrder] = useState(null);
  const [search, setSearch] = useState("");
  const isSA = me?.role==="super_admin" || [1,2].includes(me?.id);

  const load = async () => {
    setLoading(true);
    try {
      const [c,o] = await Promise.all([
        api("GET","crm_customers?order=created_at.desc"),
        api("GET","crm_orders?order=created_at.desc")
      ]);
      setCustomers(c||[]); setOrders(o||[]);
    } catch { showToast("خطا","error"); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); },[]);

  const del = async (id) => {
    if (!confirm("حذف این مشتری؟")) return;
    await api("DELETE",`crm_customers?id=eq.${id}`); showToast("حذف شد"); load();
  };

  const filteredC = customers.filter(c => !search || c.name?.includes(search) || c.phone?.includes(search) || c.city?.includes(search));
  const filteredO = orders.filter(o => !search || String(o.id).includes(search));

  if (loading) return <Spinner />;

  const gradeLabel = g => ({ standard:"معمولی", silver:"نقره‌ای", gold:"طلایی", vip:"VIP" }[g]||g);
  const gradeColor = g => ({ standard:C.textMuted, silver:"#9CA3AF", gold:"#F59E0B", vip:"#8B5CF6" }[g]||C.textMuted);

  return (
    <div style={{ animation:"fadeUp 0.3s ease" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10 }}>
        <div>
          <h2 style={{ fontSize:20, color:C.text, fontWeight:600, marginBottom:2 }}>مشتریان عمده (B2B)</h2>
          <p style={{ fontSize:12, color:C.textDim }}>{fa(customers.length)} مشتری — {fa(orders.length)} سفارش</p>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <div style={{ display:"flex", gap:0, background:C.surfaceAlt, borderRadius:8, border:`1px solid ${C.border}`, overflow:"hidden" }}>
            {[["customers","مشتریان"],["orders","سفارشات"]].map(([k,l]) => (
              <button key={k} onClick={() => setView(k)} style={{
                padding:"7px 14px", border:"none", fontFamily:FF, fontSize:12, cursor:"pointer",
                background: view===k ? C.primary : "transparent",
                color: view===k ? "#fff" : C.textMuted
              }}>{l}</button>
            ))}
          </div>
          {view==="customers" && <Btn label="مشتری جدید" icon="plus" onClick={() => { setEditCust(null); setShowForm(true); }} />}
        </div>
      </div>

      <div style={{ position:"relative", marginBottom:14 }}>
        <Ic name="search" size={15} color={C.textDim} style={{ position:"absolute", right:11, top:"50%", transform:"translateY(-50%)" }} />
        <input style={{ ...iStyle, paddingRight:34 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="جستجو..." />
      </div>

      {view==="customers" ? (
        <div style={{ display:"grid", gap:10 }}>
          {filteredC.length===0 ? <Empty /> : filteredC.map(c => (
            <div key={c.id} style={{
              padding:16, background:C.surface, borderRadius:12, border:`1px solid ${C.border}`,
              display:"flex", justifyContent:"space-between", alignItems:"center", gap:12
            }}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
                  <p style={{ fontSize:14, fontWeight:600, color:C.text }}>{c.name}</p>
                  <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4, background:gradeColor(c.grade)+"20", color:gradeColor(c.grade), fontWeight:600 }}>{gradeLabel(c.grade)}</span>
                  {c.portal_active && <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4, background:C.infoDim, color:C.info, fontWeight:600 }}>پورتال</span>}
                </div>
                <p style={{ fontSize:12, color:C.textMuted }}>
                  {c.phone ? fa(c.phone) : "—"} {c.city && `• ${c.city}`} {c.payment_terms && `• ${c.payment_terms}`}
                </p>
              </div>
              <div style={{ display:"flex", gap:6 }}>
                <Btn label="ویرایش" icon="edit" small outline onClick={() => { setEditCust(c); setShowForm(true); }} />
                {isSA && <Btn label="حذف" icon="trash" small danger onClick={() => del(c.id)} />}
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div style={{ display:"grid", gap:10 }}>
          {filteredO.length===0 ? <Empty /> : filteredO.map(o => {
            const cust = customers.find(c => c.id===o.customer_id);
            return (
              <div key={o.id} style={{
                padding:16, background:C.surface, borderRadius:12, border:`1px solid ${C.border}`, cursor:"pointer"
              }} onClick={() => setDetailOrder({ order:o, customer:cust })}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:12, color:C.textDim }}>#{fa(o.id)}</span>
                    <span style={{ fontSize:14, fontWeight:600, color:C.text }}>{cust?.name||"—"}</span>
                  </div>
                  <Tag status={o.order_status} />
                </div>
                <div style={{ display:"flex", gap:16, fontSize:12, color:C.textMuted }}>
                  <span>مبلغ: <b style={{ color:C.primary }}>{shortCur(o.total_amount)}</b></span>
                  <span>{new Date(o.created_at).toLocaleDateString("fa-IR")}</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showForm && <CustomerForm customer={editCust} onSave={() => { setShowForm(false); load(); }} onCancel={() => setShowForm(false)} showToast={showToast} />}
      {detailOrder && <OrderDetail order={detailOrder.order} customer={detailOrder.customer} me={me} showToast={showToast} onUpdate={load} onClose={() => setDetailOrder(null)} />}
    </div>
  );
}

/* ═══════════════════════════════════════ MARKETING / CRM COMM ═══════════════════════ */
const COMM_CHANNELS = [
  { key:"whatsapp", label:"واتساپ",  color:"#25D366" },
  { key:"eitaa",    label:"ایتا",    color:"#2AABEE" },
  { key:"sms",      label:"پیامک",   color:"#F59E0B" },
  { key:"call",     label:"تماس",    color:"#3B82F6" },
  { key:"visit",    label:"ویزیت",   color:"#8B5CF6" },
  { key:"email",    label:"ایمیل",   color:"#EF4444" },
];

const COMM_TYPES = [
  { key:"followup",  label:"پیگیری" },
  { key:"offer",     label:"پیشنهاد قیمت" },
  { key:"birthday",  label:"تبریک تولد" },
  { key:"campaign",  label:"کمپین بازاریابی" },
  { key:"complaint", label:"رسیدگی به شکایت" },
  { key:"other",     label:"سایر" },
];

function MarketingModule({ me, showToast }) {
  const [customers, setCustomers] = useState([]);
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("log"); // log | broadcast | stats
  const [form, setForm] = useState(null);
  const [search, setSearch] = useState("");
  const [filterChannel, setFilterChannel] = useState("all");
  const [filterType,    setFilterType]    = useState("all");
  const [mktDateFrom,   setMktDateFrom]   = useState("");
  const [mktDateTo,     setMktDateTo]     = useState("");
  const [saving, setSaving] = useState(false);

  const load = async () => {
    setLoading(true);
    try {
      const [custs, comms] = await Promise.all([
        api("GET","crm_customers?select=id,name,phone,whatsapp,eitaa_id,city,grade&order=name.asc"),
        api("GET","crm_communications?order=created_at.desc&limit=100").catch(() => []),
      ]);
      setCustomers(custs||[]);
      setLogs(comms||[]);
    } catch { showToast("خطا در بارگذاری","error"); }
    finally { setLoading(false); }
  };

  useEffect(() => { load(); }, []);

  const saveLog = async () => {
    if (!form.customer_id || !form.channel || !form.comm_type) {
      showToast("مشتری، کانال و نوع تماس الزامی است","error"); return;
    }
    setSaving(true);
    try {
      await api("POST","crm_communications",{
        ...form, created_by: me.id, created_at: new Date().toISOString()
      });
      showToast("ثبت شد"); setForm(null); load();
    } catch { showToast("جدول crm_communications باید در Supabase ساخته شود","error"); }
    finally { setSaving(false); }
  };

  const gradeColor = g => ({ standard:C.textMuted, silver:"#9CA3AF", gold:"#F59E0B", vip:"#8B5CF6" }[g]||C.textMuted);
  const chColor = k => COMM_CHANNELS.find(c=>c.key===k)?.color || C.textMuted;
  const chLabel = k => COMM_CHANNELS.find(c=>c.key===k)?.label || k;
  const typeLabel = k => COMM_TYPES.find(t=>t.key===k)?.label || k;

  const filteredLogs = logs.filter(function(l) {
    if (filterChannel !== "all" && l.channel !== filterChannel) return false;
    if (filterType !== "all" && l.comm_type !== filterType) return false;
    if (mktDateFrom) {
      try {
        var p=mktDateFrom.split("-").map(Number); var gFrom=j2g(p[0],p[1],p[2]);
        if (new Date(l.created_at) < new Date(gFrom[0],gFrom[1]-1,gFrom[2])) return false;
      } catch(e){}
    }
    if (mktDateTo) {
      try {
        var p2=mktDateTo.split("-").map(Number); var gTo=j2g(p2[0],p2[1],p2[2]);
        var end=new Date(gTo[0],gTo[1]-1,gTo[2]); end.setDate(end.getDate()+1);
        if (new Date(l.created_at) >= end) return false;
      } catch(e){}
    }
    if (search) {
      var cust = customers.find(function(c){return c.id===l.customer_id;});
      if (!cust?.name?.includes(search) && !(l.note||"").includes(search)) return false;
    }
    return true;
  });

  const filteredCusts = customers.filter(c =>
    !search || c.name?.includes(search) || c.phone?.includes(search) || c.city?.includes(search)
  );

  // Stats
  const channelStats = COMM_CHANNELS.map(ch => ({
    ...ch, count: logs.filter(l=>l.channel===ch.key).length
  })).sort((a,b)=>b.count-a.count);
  const totalLogs = logs.length;
  const thisMonth = logs.filter(l => {
    const d = new Date(l.created_at);
    const now = new Date();
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;

  const exportCommsCSV = function() {
    var header = ["مشتری","شهر","درجه","کانال","نوع تماس","یادداشت","اقدام بعدی","تاریخ یادآوری","تاریخ ثبت"];
    var dataRows = filteredLogs.map(function(l) {
      var c = customers.find(function(x) { return x.id === l.customer_id; });
      var gradeMap = { standard:"معمولی", silver:"نقره‌ای", gold:"طلایی", vip:"VIP" };
      var chLbl = COMM_CHANNELS.find(function(x){return x.key===l.channel;});
      var tpLbl = COMM_TYPES.find(function(x){return x.key===l.comm_type;});
      return [
        c ? c.name : "",
        c ? (c.city || "") : "",
        c ? (gradeMap[c.grade] || c.grade || "") : "",
        chLbl ? chLbl.label : (l.channel || ""),
        tpLbl ? tpLbl.label : (l.comm_type || ""),
        l.note || "",
        l.next_action || "",
        l.next_date ? new Date(l.next_date).toLocaleDateString("fa-IR") : "",
        l.created_at ? new Date(l.created_at).toLocaleDateString("fa-IR") : ""
      ];
    });
    var rows = [header].concat(dataRows);
    var csv = "\uFEFF" + rows.map(function(r) {
      return r.map(function(v){ return '"' + String(v).split('"').join('""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "تماس-مشتریان.csv"; a.click();
    URL.revokeObjectURL(url);
    showToast("فایل CSV دانلود شد");
  };

  if (loading) return <Spinner />;

  return (
    <div style={{ animation:"fadeUp 0.3s ease" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10 }}>
        <div>
          <h2 style={{ fontSize:20, color:C.text, fontWeight:600, marginBottom:2 }}>ارتباط با مشتری</h2>
          <p style={{ fontSize:12, color:C.textDim }}>پیگیری، کمپین و تاریخچه تماس‌ها</p>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <Btn label="خروجی CSV" icon="download" small outline onClick={exportCommsCSV} />
          <Btn label="ثبت تماس جدید" icon="plus" onClick={() => setForm({ customer_id:"", channel:"whatsapp", comm_type:"followup", result:"", next_action:"", next_date:"", note:"" })} />
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display:"flex", gap:0, background:C.surfaceAlt, borderRadius:10, border:`1px solid ${C.border}`, overflow:"hidden", marginBottom:18, width:"fit-content" }}>
        {[["log","تاریخچه تماس‌ها"],["customers","لیست مشتریان"],["stats","آمار بازاریابی"]].map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding:"8px 16px", border:"none", fontFamily:FF, fontSize:12, cursor:"pointer",
            background: tab===k ? C.primary : "transparent", color: tab===k ? "#fff" : C.textMuted
          }}>{l}</button>
        ))}
      </div>

      {/* ── TAB: LOG ── */}
      {tab==="log" && (
        <>
          <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center" }}>
            <div style={{ position:"relative", flex:1, minWidth:180 }}>
              <Ic name="search" size={15} color={C.textDim} style={{ position:"absolute", right:11, top:"50%", transform:"translateY(-50%)" }} />
              <input style={{ ...iStyle, paddingRight:34 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="جستجو در تماس‌ها..." />
            </div>
            <select style={{ ...iStyle, width:"auto", cursor:"pointer" }} value={filterChannel} onChange={e=>setFilterChannel(e.target.value)}>
              <option value="all">همه کانال‌ها</option>
              {COMM_CHANNELS.map(ch => <option key={ch.key} value={ch.key}>{ch.label}</option>)}
            </select>
            <select style={{ ...iStyle, width:"auto", cursor:"pointer" }} value={filterType||"all"} onChange={e=>setFilterType(e.target.value)}>
              <option value="all">همه انواع</option>
              {COMM_TYPES.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
            </select>
            <div style={{ minWidth:150 }}>
              <JalaliPicker value={mktDateFrom} onChange={setMktDateFrom} placeholder="از تاریخ" />
            </div>
            <div style={{ minWidth:150 }}>
              <JalaliPicker value={mktDateTo} onChange={setMktDateTo} placeholder="تا تاریخ" />
            </div>
            {(mktDateFrom||mktDateTo) && (
              <button onClick={()=>{setMktDateFrom("");setMktDateTo("");}} style={{ background:"transparent", border:`1px solid ${C.border}`, borderRadius:8, color:C.textMuted, padding:"7px 10px", cursor:"pointer", fontSize:11, fontFamily:FF }}>✕ پاک</button>
            )}
            <span style={{ fontSize:11, color:C.textDim, whiteSpace:"nowrap" }}>{fa(filteredLogs.length)} تماس</span>
          </div>

          <div style={{ display:"grid", gap:10 }}>
            {filteredLogs.length===0 ? <Empty text="تماسی ثبت نشده" icon="📞" /> : filteredLogs.map((l,i) => {
              const cust = customers.find(c=>c.id===l.customer_id);
              const cc = chColor(l.channel);
              return (
                <div key={i} style={{
                  padding:16, background:C.surface, borderRadius:12,
                  border:`1px solid ${C.border}`, borderRight:`3px solid ${cc}`
                }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <p style={{ fontSize:14, fontWeight:600, color:C.text }}>{cust?.name||"—"}</p>
                      <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4, background:cc+"20", color:cc, fontWeight:600 }}>{chLabel(l.channel)}</span>
                      <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4, background:C.surfaceAlt, color:C.textMuted }}>{typeLabel(l.comm_type)}</span>
                    </div>
                    <span style={{ fontSize:11, color:C.textDim }}>{l.created_at ? new Date(l.created_at).toLocaleDateString("fa-IR") : "—"}</span>
                  </div>
                  {l.note && <p style={{ fontSize:12, color:C.textMuted, marginBottom:l.next_action?6:0 }}>{l.note}</p>}
                  {l.next_action && (
                    <p style={{ fontSize:11, padding:"5px 10px", background:C.warningDim, borderRadius:6, color:C.warning }}>
                      اقدام بعدی: {l.next_action} {l.next_date && `— ${new Date(l.next_date).toLocaleDateString("fa-IR")}`}
                    </p>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}

      {/* ── TAB: CUSTOMERS ── */}
      {tab==="customers" && (
        <>
          <div style={{ position:"relative", marginBottom:14 }}>
            <Ic name="search" size={15} color={C.textDim} style={{ position:"absolute", right:11, top:"50%", transform:"translateY(-50%)" }} />
            <input style={{ ...iStyle, paddingRight:34 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="جستجوی مشتری..." />
          </div>
          <div style={{ display:"grid", gap:10 }}>
            {filteredCusts.length===0 ? <Empty /> : filteredCusts.map(c => {
              const custLogs = logs.filter(l=>l.customer_id===c.id);
              const lastLog = custLogs[0];
              const daysSince = lastLog ? Math.floor((Date.now()-new Date(lastLog.created_at))/86400000) : null;
              const urgent = daysSince===null || daysSince > 30;
              return (
                <div key={c.id} style={{
                  padding:16, background:C.surface, borderRadius:12,
                  border:`1px solid ${C.border}`, borderRight:`3px solid ${urgent ? C.warning : C.success}`,
                  display:"flex", justifyContent:"space-between", alignItems:"center"
                }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
                      <p style={{ fontSize:14, fontWeight:600, color:C.text }}>{c.name}</p>
                      <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:gradeColor(c.grade)+"20", color:gradeColor(c.grade), fontWeight:600 }}>
                        {{ standard:"معمولی", silver:"نقره‌ای", gold:"طلایی", vip:"VIP" }[c.grade]||c.grade}
                      </span>
                      {urgent && <span style={{ fontSize:10, padding:"2px 6px", borderRadius:4, background:C.warningDim, color:C.warning, fontWeight:600 }}>نیاز به پیگیری</span>}
                    </div>
                    <div style={{ fontSize:12, color:C.textMuted, display:"flex", gap:12 }}>
                      {c.phone && <span>📞 {fa(c.phone)}</span>}
                      {c.whatsapp && <span>💬 {fa(c.whatsapp)}</span>}
                      {c.city && <span>📍 {c.city}</span>}
                      {daysSince!==null && <span style={{ color: daysSince>30?C.warning:C.success }}>آخرین تماس: {fa(daysSince)} روز پیش</span>}
                      {daysSince===null && <span style={{ color:C.danger }}>بدون تماس</span>}
                    </div>
                  </div>
                  <Btn label="ثبت تماس" icon="plus" small onClick={() =>
                    setForm({ customer_id:c.id, channel:"whatsapp", comm_type:"followup", result:"", next_action:"", next_date:"", note:"" })
                  } />
                </div>
              );
            })}
          </div>
        </>
      )}

      {/* ── TAB: STATS ── */}
      {tab==="stats" && (
        <div style={{ display:"grid", gap:16 }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))", gap:12 }}>
            <KPICard label="کل تماس‌ها" value={fa(totalLogs)} icon="trend" color={C.primary} />
            <KPICard label="این ماه" value={fa(thisMonth)} icon="chart" color={C.info} />
            <KPICard label="مشتریان فعال" value={fa(customers.length)} icon="users" color={C.success} />
            <KPICard label="نیاز به پیگیری" value={fa(customers.filter(c=>{
              const last = logs.find(l=>l.customer_id===c.id);
              return !last || (Date.now()-new Date(last.created_at))/86400000 > 30;
            }).length)} icon="alert" color={C.warning} />
          </div>

          <div style={{ padding:20, background:C.surface, borderRadius:14, border:`1px solid ${C.border}` }}>
            <p style={{ fontSize:13, fontWeight:600, color:C.text, marginBottom:14 }}>تماس‌ها به تفکیک کانال</p>
            <div style={{ display:"grid", gap:8 }}>
              {channelStats.map(ch => (
                <div key={ch.key} style={{ display:"flex", alignItems:"center", gap:12 }}>
                  <span style={{ fontSize:13, color:C.text, width:80 }}>{ch.label}</span>
                  <div style={{ flex:1, background:C.border, borderRadius:4, height:8, overflow:"hidden" }}>
                    <div style={{ width: totalLogs > 0 ? `${(ch.count/totalLogs)*100}%` : "0%", height:"100%", background:ch.color, borderRadius:4, transition:"width 0.5s" }} />
                  </div>
                  <span style={{ fontSize:12, color:C.textMuted, width:40, textAlign:"left" }}>{fa(ch.count)}</span>
                </div>
              ))}
            </div>
          </div>

          <div style={{ padding:20, background:C.surface, borderRadius:14, border:`1px solid ${C.border}` }}>
            <p style={{ fontSize:13, fontWeight:600, color:C.text, marginBottom:14 }}>پرتکرارترین مشتریان</p>
            <div style={{ display:"grid", gap:8 }}>
              {customers.map(c => ({ ...c, cnt: logs.filter(l=>l.customer_id===c.id).length }))
                .filter(c=>c.cnt>0).sort((a,b)=>b.cnt-a.cnt).slice(0,8).map((c,i) => (
                <div key={c.id} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 10px", background:C.surfaceAlt, borderRadius:8 }}>
                  <span style={{ fontSize:13, color:C.text }}>{c.name}</span>
                  <span style={{ fontSize:12, padding:"2px 9px", borderRadius:5, background:C.primaryDim, color:C.primary, fontWeight:600 }}>{fa(c.cnt)} تماس</span>
                </div>
              ))}
              {!logs.length && <Empty text="هنوز تماسی ثبت نشده" icon="📊" />}
            </div>
          </div>
        </div>
      )}

      {/* ── FORM MODAL ── */}
      {form && (
        <Modal title="ثبت تماس / پیگیری" onClose={() => setForm(null)} maxWidth={500}>
          <Fld label="مشتری *">
            <select style={{ ...iStyle, cursor:"pointer" }} value={form.customer_id} onChange={e=>setForm(f=>({...f,customer_id:e.target.value}))}>
              <option value="">انتخاب کنید...</option>
              {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Fld>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Fld label="کانال ارتباطی *">
              <select style={{ ...iStyle, cursor:"pointer" }} value={form.channel} onChange={e=>setForm(f=>({...f,channel:e.target.value}))}>
                {COMM_CHANNELS.map(ch => <option key={ch.key} value={ch.key}>{ch.label}</option>)}
              </select>
            </Fld>
            <Fld label="نوع ارتباط *">
              <select style={{ ...iStyle, cursor:"pointer" }} value={form.comm_type} onChange={e=>setForm(f=>({...f,comm_type:e.target.value}))}>
                {COMM_TYPES.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
              </select>
            </Fld>
          </div>
          <Fld label="نتیجه / خلاصه مکالمه">
            <textarea style={{ ...iStyle, resize:"none" }} rows={3} value={form.note||""} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="چه اتفاقی افتاد، مشتری چه گفت..." />
          </Fld>
          <Fld label="اقدام بعدی">
            <input style={iStyle} value={form.next_action||""} onChange={e=>setForm(f=>({...f,next_action:e.target.value}))} placeholder="مثال: ارسال نمونه، تماس مجدد..." />
          </Fld>
          <Fld label="تاریخ یادآوری">
            <JalaliPicker value={form.next_date||""} onChange={v=>setForm(f=>({...f,next_date:v}))} placeholder="انتخاب تاریخ یادآوری" />
          </Fld>
          <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
            <Btn label="انصراف" onClick={() => setForm(null)} outline />
            <Btn label={saving?"در حال ذخیره...":"ثبت تماس"} icon="check" onClick={saveLog} disabled={saving} />
          </div>
        </Modal>
      )}
    </div>
  );
}


/* mini helper */
function OrderSummaryCards({ filtered }) {
  const totalRev  = filtered.reduce((s,o)=>s+(o.total_amount||0),0);
  const pending   = filtered.filter(o=>["pending_payment","contract_pending","stock_check"].includes(o.order_status)).length;
  const delivered = filtered.filter(o=>o.order_status==="delivered").length;
  return (
    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:10, marginBottom:14 }}>
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 14px" }}>
        <p style={{ fontSize:10, color:C.textDim, marginBottom:4 }}>فیلترشده</p>
        <p style={{ fontSize:18, fontWeight:700, color:C.primary }}>{fa(filtered.length)}</p>
      </div>
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 14px" }}>

/* ═══════════════════════════════════════ ORDERS MODULE ══════════════════════════════ */
function OrdersModule({ me, showToast }) {
  const [orders, setOrders]     = useState([]);
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [selected, setSelected] = useState(null);
  const [newOrder, setNewOrder] = useState(false);
  const [search, setSearch]     = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [ordDateFrom, setOrdDateFrom]   = useState("");
  const [ordDateTo,   setOrdDateTo]     = useState("");

  const load = async () => {
    setLoading(true);
    try {
      const [ords, custs] = await Promise.all([
        api("GET","crm_orders?order=created_at.desc"),
        api("GET","crm_customers?select=id,name,phone,credit_allowed")
      ]);
      setOrders(ords||[]); setCustomers(custs||[]);
    } catch { showToast("خطا در بارگذاری","error"); }
    finally { setLoading(false); }
  };

  useEffect(() => { load(); }, []);

  const custMap = Object.fromEntries((customers||[]).map(c=>[c.id,c]));

  const exportOrdersCSV = () => {
    var header = ["شماره","مشتری","تلفن","نوع","مبلغ","وضعیت","تاریخ ثبت"];
    var dataRows = filtered.map(function(o) {
      var c = custMap[o.customer_id];
      return [
        o.id,
        c ? c.name : "",
        c ? c.phone : "",
        o.order_type === "custom" ? "سفارشی" : "انبار",
        o.total_amount || 0,
        ORDER_STATUS[o.order_status] ? ORDER_STATUS[o.order_status].label : (o.order_status || ""),
        new Date(o.created_at).toLocaleDateString("fa-IR")
      ];
    });
    var rows = [header].concat(dataRows);
    var csv = "\uFEFF" + rows.map(function(r) {
      return r.map(function(v) { return '"' + String(v).split('"').join('""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "سفارشات.csv"; a.click();
    URL.revokeObjectURL(url);
    showToast("فایل CSV دانلود شد");
  };

  const filtered = orders.filter(function(o) {
    var cust = custMap[o.customer_id];
    if (search && !cust?.name?.includes(search) && !String(o.id).includes(search)) return false;
    if (statusFilter !== "all" && o.order_status !== statusFilter) return false;
    if (ordDateFrom) {
      try { var p=ordDateFrom.split("-").map(Number); var g=j2g(p[0],p[1],p[2]); if(new Date(o.created_at)<new Date(g[0],g[1]-1,g[2])) return false; } catch(e){}
    }
    if (ordDateTo) {
      try { var p2=ordDateTo.split("-").map(Number); var g2=j2g(p2[0],p2[1],p2[2]); var e2=new Date(g2[0],g2[1]-1,g2[2]); e2.setDate(e2.getDate()+1); if(new Date(o.created_at)>=e2) return false; } catch(e){}
    }
    return true;
  });

  const selectedCust = selected ? custMap[selected.customer_id] : null;

  if (loading) return <Spinner />;

  if (selected) return (
    <OrderDetail
      order={selected} customer={selectedCust} me={me} showToast={showToast}
      onUpdate={load} onClose={() => setSelected(null)}
    />
  );

  return (
    <div style={{ animation:"fadeUp 0.3s ease" }}>
      {/* ─── هدر + دکمه‌ها ─── */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10 }}>
        <div>
          <h2 style={{ fontSize:20, color:C.text, fontWeight:600, marginBottom:2 }}>مدیریت سفارشات</h2>
          <p style={{ fontSize:12, color:C.textDim }}>{fa(orders.length)} سفارش کل</p>
        </div>
        <div style={{ display:"flex", gap:8 }}>
          <Btn label="خروجی CSV" icon="download" small outline onClick={exportOrdersCSV} />
          <Btn label="ثبت سفارش جدید" icon="plus" onClick={() => setNewOrder(true)} />
        </div>
      </div>

      {/* ─── کارت‌های خلاصه ─── */}
      <OrderSummaryCards filtered={filtered} />

      {/* ─── فیلترها ─── */}
      <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center" }}>
        <div style={{ position:"relative", flex:1, minWidth:200 }}>
          <Ic name="search" size={14} color={C.textDim} style={{ position:"absolute", right:11, top:"50%", transform:"translateY(-50%)" }} />
          <input style={{ ...iStyle, paddingRight:32 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="جستجو مشتری یا شماره..." />
        </div>
        <select style={{ ...iStyle, maxWidth:180, cursor:"pointer" }} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="all">همه وضعیت‌ها</option>
          {Object.entries(ORDER_STATUS).map(([k,v])=>(
            <option key={k} value={k}>{v.label}</option>
          ))}
        </select>
        <div style={{ minWidth:148 }}>
          <JalaliPicker value={ordDateFrom} onChange={setOrdDateFrom} placeholder="از تاریخ" />
        </div>
        <div style={{ minWidth:148 }}>
          <JalaliPicker value={ordDateTo} onChange={setOrdDateTo} placeholder="تا تاریخ" />
        </div>
        {(ordDateFrom||ordDateTo) && (
          <button onClick={function(){setOrdDateFrom("");setOrdDateTo("");}} style={{ background:"transparent", border:"1px solid "+C.border, borderRadius:8, color:C.textMuted, padding:"7px 10px", cursor:"pointer", fontSize:11, fontFamily:FF }}>✕ پاک</button>
        )}
        <span style={{ fontSize:11, color:C.textDim, whiteSpace:"nowrap" }}>{fa(filtered.length)} سفارش</span>
      </div>

      {/* لیست */}
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, overflow:"hidden" }}>
        <div style={{ display:"grid", gridTemplateColumns:"60px 2fr 110px 90px 130px 130px 100px" }}>
          {["#","مشتری","تاریخ","نوع","مبلغ","وضعیت",""].map((h,i)=>(
            <div key={i} style={{ padding:"10px 14px", fontSize:11, color:C.textMuted, fontWeight:700, borderBottom:`1px solid ${C.border}` }}>{h}</div>
          ))}
          {filtered.length===0
            ? <div style={{ gridColumn:"1/-1" }}><Empty text="سفارشی یافت نشد" icon="📋" /></div>
            : filtered.map((o,i)=>{
              const cust = custMap[o.customer_id];
              return (
                <React.Fragment key={o.id}>
                  <div style={{ padding:"12px 14px", fontSize:12, color:C.text, fontWeight:500, borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}>#{fa(o.id)}</div>
                  <div style={{ padding:"12px 14px", fontSize:13, fontWeight:600, color:C.text, borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}>{cust?.name||"—"}</div>
                  <div style={{ padding:"12px 14px", fontSize:11, color:C.textMuted, borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}>{new Date(o.created_at).toLocaleDateString("fa-IR")}</div>
                  <div style={{ padding:"12px 14px", borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}>
                    <span style={{ fontSize:11, padding:"3px 8px", borderRadius:5, background:o.order_type==="custom"?"#8B5CF622":"#06B6D422", color:o.order_type==="custom"?C.purple:C.teal }}>{o.order_type==="custom"?"سفارشی":"انبار"}</span>
                  </div>
                  <div style={{ padding:"12px 14px", fontSize:13, fontWeight:600, color:C.primary, borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}>{shortCur(o.total_amount)}</div>
                  <div style={{ padding:"12px 14px", borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}><Tag status={o.order_status} /></div>
                  <div style={{ padding:"8px 14px", borderBottom:i<filtered.length-1?`1px solid ${C.border}`:"none", background:i%2===0?C.surface:C.surfaceAlt, display:"flex", alignItems:"center" }}>
                    <Btn label="جزئیات" icon="eye" small outline onClick={() => setSelected(o)} />
                  </div>
                </React.Fragment>
              );
            })
          }
        </div>
      </div>

      {/* ─── مودال ثبت سفارش جدید ─── */}
      {newOrder && (
        <NewOrderModal
          customers={customers}
          showToast={showToast}
          onClose={() => setNewOrder(false)}
          onSaved={() => { setNewOrder(false); load(); }}
        />
      )}
    </div>
  );
}

/* ═══════════════════════════════════════ NEW ORDER MODAL ════════════════════════════ */
function NewOrderModal({ customers, showToast, onClose, onSaved }) {
  const [products, setProducts] = useState([]);
  const [saving, setSaving]     = useState(false);
  const [form, setForm]         = useState({
    customer_id:"", order_type:"stock", note:"", delivery_address:""
  });
  const [items, setItems] = useState([{ product_id:"", product_name:"", qty:1, unit_price:0 }]);

  useEffect(function() {
    api("GET","products?order=name.asc").then(function(p){ setProducts(p||[]); }).catch(function(){});
  }, []);

  var prodMap = {};
  products.forEach(function(p){ prodMap[p.id] = p; });

  var totalAmount = items.reduce(function(s,it){
    return s + (Number(it.qty)||0) * (Number(it.unit_price)||0);
  }, 0);

  function addItem() {
    setItems(function(prev){ return prev.concat([{ product_id:"", product_name:"", qty:1, unit_price:0 }]); });
  }
  function removeItem(idx) {
    setItems(function(prev){ return prev.filter(function(_,i){ return i!==idx; }); });
  }
  function updateItem(idx, key, val) {
    setItems(function(prev){
      return prev.map(function(it,i){
        if (i !== idx) return it;
        var updated = Object.assign({}, it);
        updated[key] = val;
        if (key === "product_id") {
          var p = prodMap[val];
          if (p) { updated.product_name = p.name; updated.unit_price = p.base_price || 0; }
        }
        return updated;
      });
    });
  }

  var save = async function() {
    if (!form.customer_id) { showToast("مشتری را انتخاب کنید","error"); return; }
    var validItems = items.filter(function(it){ return it.product_id && Number(it.qty)>0; });
    if (!validItems.length) { showToast("حداقل یک محصول اضافه کنید","error"); return; }
    setSaving(true);
    try {
      var order = await api("POST","crm_orders",{
        customer_id: Number(form.customer_id),
        order_type: form.order_type,
        order_status: "registered",
        total_amount: totalAmount,
        note: form.note || null,
        delivery_address: form.delivery_address || null,
        created_at: new Date().toISOString()
      });
      if (order && order.id) {
        for (var i=0; i<validItems.length; i++) {
          var it = validItems[i];
          await api("POST","crm_order_items",{
            order_id: order.id,
            product_id: Number(it.product_id),
            product_name: it.product_name,
            qty: Number(it.qty),
            unit_price: Number(it.unit_price),
            total: Number(it.qty)*Number(it.unit_price)
          });
        }
      }
      showToast("سفارش ثبت شد");
      onSaved();
    } catch { showToast("خطا در ثبت سفارش","error"); }
    finally { setSaving(false); }
  };

  return (
    <Modal title="ثبت سفارش جدید" onClose={onClose} maxWidth={600}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        <Fld label="مشتری *">
          <select style={{ ...iStyle, cursor:"pointer" }} value={form.customer_id} onChange={function(e){setForm(function(f){return Object.assign({},f,{customer_id:e.target.value});});}}>
            <option value="">انتخاب کنید...</option>
            {customers.map(function(c){ return <option key={c.id} value={c.id}>{c.name}</option>; })}
          </select>
        </Fld>
        <Fld label="نوع سفارش">
          <select style={{ ...iStyle, cursor:"pointer" }} value={form.order_type} onChange={function(e){setForm(function(f){return Object.assign({},f,{order_type:e.target.value});});}}>
            <option value="stock">از انبار</option>
            <option value="custom">سفارشی / تولید</option>
          </select>
        </Fld>
      </div>
      <Fld label="آدرس تحویل">
        <input style={iStyle} value={form.delivery_address||""} onChange={function(e){setForm(function(f){return Object.assign({},f,{delivery_address:e.target.value});});}} placeholder="آدرس تحویل سفارش..." />
      </Fld>

      <div style={{ marginBottom:6, marginTop:4 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <p style={{ fontSize:12, fontWeight:700, color:C.textMuted }}>اقلام سفارش</p>
          <Btn label="افزودن قلم" icon="plus" small outline onClick={addItem} />
        </div>
        <div style={{ display:"grid", gap:8 }}>
          {items.map(function(it, idx) {
            return (
              <div key={idx} style={{ display:"grid", gridTemplateColumns:"2fr 80px 120px auto", gap:8, alignItems:"center", background:C.surfaceAlt, borderRadius:8, padding:"8px 10px" }}>
                <select style={{ ...iStyle, fontSize:12 }} value={it.product_id} onChange={function(e){ updateItem(idx,"product_id",e.target.value); }}>
                  <option value="">انتخاب محصول...</option>
                  {products.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
                </select>
                <input type="number" style={{ ...iStyle, fontSize:12 }} value={it.qty} onChange={function(e){ updateItem(idx,"qty",e.target.value); }} placeholder="تعداد" min="1" />
                <input type="number" style={{ ...iStyle, fontSize:12 }} value={it.unit_price} onChange={function(e){ updateItem(idx,"unit_price",e.target.value); }} placeholder="قیمت واحد" />
                {items.length > 1 && (
                  <button onClick={function(){ removeItem(idx); }} style={{ background:"transparent", border:"none", cursor:"pointer", color:C.danger, fontSize:16, padding:"0 4px" }}>✕</button>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ background:C.primaryDim, borderRadius:8, padding:"10px 14px", display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
        <span style={{ fontSize:12, color:C.textMuted }}>مجموع سفارش</span>
        <span style={{ fontSize:16, fontWeight:700, color:C.primary }}>{shortCur(totalAmount)}</span>
      </div>

      <Fld label="توضیحات">
        <textarea style={{ ...iStyle, resize:"none" }} rows={2} value={form.note||""} onChange={function(e){setForm(function(f){return Object.assign({},f,{note:e.target.value});});}} placeholder="توضیحات اضافه..." />
      </Fld>

      <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:4 }}>
        <Btn label="انصراف" onClick={onClose} outline />
        <Btn label={saving?"در حال ثبت...":"ثبت سفارش"} icon="check" onClick={save} disabled={saving} />
      </div>
    </Modal>
  );
}

function TierDiscountTable({ isAdmin }) {
  var [tiers, setTiers] = React.useState(PRICE_TIERS.map(function(t){ return t.discount; }));
  var [editing, setEditing] = React.useState(false);
  var [draft, setDraft] = React.useState(tiers.slice());

  var saveTiers = function() {
    try { localStorage.setItem("price_tiers", JSON.stringify(draft)); } catch(e){}
    draft.forEach(function(d,i){ PRICE_TIERS[i].discount = d; PRICE_TIERS[i].note = d===0?"نرخ پایه":fa(d)+"٪ تخفیف"; });

    setEditing(false);
  };

                  style={{ ...iStyle, width:70, padding:"6px 10px", fontSize:14, fontWeight:700, textAlign:"center" }}
                />
              ) : (
                <span style={{ fontSize:13, fontWeight:700, padding:"3px 10px", borderRadius:6,
                  background:d===0?C.surfaceAlt:d<10?C.warningDim:C.successDim,
                  color:d===0?C.textMuted:d<10?C.warning:C.success }}>
                  {d===0?"بدون تخفیف":fa(d)+"٪"}
                </span>
              )}
            </div>
            <div style={{ padding:"11px 16px", fontSize:12, color:C.textMuted }}>
              {d===0?"قیمت پایه":"قیمت پایه × "+fa(100-d)+"٪"}

            <div style={{ padding:"11px 16px", fontSize:12, color:C.textMuted }}>
              {d===0?"نرخ پایه":fa(d)+"٪ تخفیف"}

}

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Fld label="قیمت پایه (تومان)">
              <input style={iStyle} type="number" value={form.base_price||0} onChange={e=>setForm(f=>({...f,base_price:+e.target.value}))} />
            </Fld>
            <Fld label="موجودی (کارتن)">
              <input style={iStyle} type="number" value={form.stock||0} onChange={e=>setForm(f=>({...f,stock:+e.target.value}))} />
            </Fld>
          </div>
          <Fld label="توضیحات">
            <textarea style={{ ...iStyle, resize:"none" }} rows={2} value={form.description||""} onChange={e=>setForm(f=>({...f,description:e.target.value}))} />
          </Fld>
          <div style={{ display:"flex", gap:12, alignItems:"center", padding:"10px 0" }}>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:13, color:C.text }}>
              <input type="checkbox" checked={!!form.has_guarantee} onChange={e=>setForm(f=>({...f,has_guarantee:e.target.checked}))} style={{ width:16, height:16, cursor:"pointer" }} />

                <input style={{ ...iStyle, width:90 }} type="number" value={form.guarantee_days||30} onChange={e=>setForm(f=>({...f,guarantee_days:+e.target.value}))} min="1" />

              </div>
            )}
          </div>
          <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
            <Btn label="انصراف" onClick={() => setForm(null)} outline />
            <Btn label={saving?"...":"ذخیره"} icon="check" onClick={save} disabled={saving} />
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════ SCORPION B2C ═══════════════════════════════ */
function ScorpionModule({ showToast }) {
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  useEffect(() => {
    (async () => {
      try { const d = await api("GET","scorpion_customers?order=created_at.desc"); setCustomers(d||[]); }
      catch { showToast("خطا","error"); }
      finally { setLoading(false); }
    })();
  },[]);
  const filtered = customers.filter(c => !search || c.name?.includes(search) || c.phone?.includes(search));
  if (loading) return <Spinner />;
  return (
    <div style={{ animation:"fadeUp 0.3s ease" }}>
      <div style={{ marginBottom:16 }}>
        <h2 style={{ fontSize:20, color:C.text, fontWeight:600, marginBottom:2 }}>مشتریان خرده‌فروشی</h2>
        <p style={{ fontSize:12, color:C.textDim }}>{fa(customers.length)} مشتری خرده</p>
      </div>
      <div style={{ position:"relative", marginBottom:14 }}>
        <input style={{ ...iStyle, paddingRight:34 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder="جستجو..." />
      </div>
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, overflow:"hidden" }}>
        <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1fr", borderBottom:`1px solid ${C.border}` }}>
          {["نام","تلفن","شهر","تاریخ ثبت"].map((h,i)=>(
            <div key={i} style={{ padding:"10px 14px", fontSize:11, color:C.textDim, fontWeight:700 }}>{h}</div>
          ))}
        </div>
        {filtered.length===0 ? <Empty text="مشتری یافت نشد" icon="🛒" /> : filtered.map((c,i)=>(
          <div key={c.id} style={{
            display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1fr",
            borderBottom: i<filtered.length-1?`1px solid ${C.border}`:"none",
            background: i%2===0?C.surface:C.surfaceAlt, alignItems:"center"
          }}>
            <div style={{ padding:"11px 14px", fontSize:13, fontWeight:600 }}>{c.name}</div>
            <div style={{ padding:"11px 14px", fontSize:12, color:C.textMuted }}>{fa(c.phone||"—")}</div>
            <div style={{ padding:"11px 14px", fontSize:12, color:C.textMuted }}>{c.city||"—"}</div>
            <div style={{ padding:"11px 14px", fontSize:12, color:C.textMuted }}>{c.created_at?new Date(c.created_at).toLocaleDateString("fa-IR"):"—"}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════ ACCESS MODULE ══════════════════════════════ */
const ROLE_LABEL = { super_admin:"مدیر ارشد", admin:"ادمین", viewer:"مشاهده‌گر" };
const ROLE_COLOR = { super_admin:C.primary,    admin:C.info,   viewer:C.textDim     };
const EMPTY_ADMIN = { name:"", username:"", password:"", role:"admin", active:true };

function AccessModule({ me, showToast }) {
  const [admins, setAdmins]   = useState([...ADMIN_USERS]);
  const [form, setForm]       = useState(null);   // null | object
  const [editId, setEditId]   = useState(null);
  const [saving, setSaving]   = useState(false);
  const [showPw, setShowPw]   = useState(false);
  const isSA = me?.role === "super_admin";

  /* ── ذخیره / آپدیت ── */
  const save = async () => {
    if (!form.name || !form.username) { showToast("نام و نام‌کاربری الزامی است","error"); return; }
    if (!editId && !form.password)    { showToast("رمز عبور الزامی است","error"); return; }
    setSaving(true);
    try {
      /* تلاش برای ذخیره در Supabase */
      if (editId) {
        await api("PATCH",`crm_admin_users?id=eq.${editId}`, form);
      } else {
        await api("POST","crm_admin_users", { ...form, created_at: new Date().toISOString() });
      }
      showToast(editId ? "بروز شد" : "کاربر اضافه شد");
    } catch {
      /* fallback: فقط local state */
      if (editId) {
        setAdmins(a => a.map(u => u.id===editId ? { ...u, ...form } : u));
      } else {
        setAdmins(a => [...a, { ...form, id: Date.now() }]);
      }
      showToast(editId ? "بروز شد (محلی)" : "اضافه شد (محلی)");
    }
    setForm(null); setEditId(null); setSaving(false);
  };

  const remove = (id) => {
    if (!confirm("این کاربر حذف شود؟")) return;
    setAdmins(a => a.filter(u => u.id !== id));
    showToast("حذف شد");
  };

  const toggleActive = (id) => {
    setAdmins(a => a.map(u => u.id===id ? { ...u, active: u.active===false } : u));
    showToast("وضعیت تغییر کرد");
  };

  return (
    <div style={{ animation:"fadeUp 0.3s ease" }}>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
        <div>
          <h2 style={{ fontSize:20, color:C.text, fontWeight:600, marginBottom:4 }}>کنترل دسترسی</h2>
          <p style={{ fontSize:12, color:C.textDim }}>مدیریت کاربران و سطح دسترسی پنل مدیریت</p>
        </div>
        {isSA && (
          <Btn label="کاربر جدید" icon="plus" onClick={() => { setForm({...EMPTY_ADMIN}); setEditId(null); }} />
        )}
      </div>

      {/* آمار نقش‌ها */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, marginBottom:24 }}>
        {[["super_admin","مدیر ارشد",C.primary],["admin","ادمین",C.info],["viewer","مشاهده‌گر",C.textDim]].map(([role,label,color])=>(
          <div key={role} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16 }}>
            <div style={{ fontSize:11, color:C.textDim, marginBottom:6 }}>{label}</div>
            <div style={{ fontSize:28, fontWeight:700, color }}>{fa(admins.filter(a=>a.role===role).length)}</div>
            <div style={{ fontSize:11, color:C.textMuted, marginTop:4 }}>نفر</div>
          </div>
        ))}
      </div>

      {/* لیست کاربران */}
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, overflow:"hidden", marginBottom:24 }}>
        <div style={{ padding:"14px 18px", borderBottom:`1px solid ${C.border}`, display:"flex", alignItems:"center" }}>
          <h3 style={{ fontSize:14, fontWeight:700, color:C.text, flex:1 }}>کاربران پنل مدیریت</h3>
        </div>
        {admins.map((a,i) => {
          const inactive = a.active === false;
          return (
            <div key={a.id} style={{
              display:"flex", alignItems:"center", gap:12, padding:"13px 18px",
              borderBottom: i<admins.length-1?`1px solid ${C.border}`:"none",
              background: a.id===me?.id ? C.primaryDim : i%2===0?C.surface:C.surfaceAlt,
              opacity: inactive ? 0.5 : 1
            }}>
              <div style={{ width:38, height:38, borderRadius:"50%", background:ROLE_COLOR[a.role]+"22",
                display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:700,
                color:ROLE_COLOR[a.role], flexShrink:0 }}>
                {a.name.charAt(0)}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:600, color:C.text, display:"flex", alignItems:"center", gap:6 }}>
                  {a.name}
                  {a.id===me?.id && <span style={{ fontSize:10, color:C.primary, background:C.primaryDim, padding:"1px 6px", borderRadius:4 }}>شما</span>}
                  {inactive && <span style={{ fontSize:10, color:C.danger, background:C.dangerDim, padding:"1px 6px", borderRadius:4 }}>غیرفعال</span>}
                </div>
                <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>@{a.username}</div>
              </div>

              {/* نقش — قابل تغییر توسط super_admin */}
              {isSA && a.id !== me?.id ? (
                <select value={a.role} onChange={e => setAdmins(arr => arr.map(u => u.id===a.id?{...u,role:e.target.value}:u))}
                  style={{ ...iStyle, width:120, padding:"4px 8px", fontSize:12, cursor:"pointer" }}>
                  <option value="super_admin">مدیر ارشد</option>
                  <option value="admin">ادمین</option>
                  <option value="viewer">مشاهده‌گر</option>
                </select>
              ) : (
                <span style={{ fontSize:11, fontWeight:600, padding:"4px 10px", borderRadius:6,
                  background:ROLE_COLOR[a.role]+"22", color:ROLE_COLOR[a.role], whiteSpace:"nowrap" }}>
                  {ROLE_LABEL[a.role]}
                </span>
              )}

              {isSA && a.id !== me?.id && (
                <div style={{ display:"flex", gap:6 }}>
                  <Btn label="ویرایش" icon="edit" small outline onClick={() => { setForm({...a}); setEditId(a.id); }} />
                  <Btn label={inactive?"فعال":"غیرفعال"} small outline onClick={() => toggleActive(a.id)} />
                  <Btn label="حذف" icon="trash" small danger onClick={() => remove(a.id)} />
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ماتریس دسترسی */}
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, overflow:"hidden" }}>
        <div style={{ padding:"14px 18px", borderBottom:`1px solid ${C.border}` }}>
          <h3 style={{ fontSize:14, fontWeight:700, color:C.text }}>ماتریس دسترسی</h3>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
            <thead>
              <tr style={{ borderBottom:`1px solid ${C.border}` }}>
                <th style={{ padding:"10px 16px", textAlign:"right", color:C.textDim, minWidth:160 }}>ماژول</th>
                {[["مدیر ارشد",C.primary],["ادمین",C.info],["مشاهده‌گر",C.textDim]].map(([r,c])=>(
                  <th key={r} style={{ padding:"10px 20px", color:c, textAlign:"center", fontWeight:600 }}>{r}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                ["داشبورد","✓ کامل","✓ کامل","✓ کامل"],
                ["مالی و حسابداری","✓ کامل","✓ کامل","👁 فقط مشاهده"],
                ["عمده‌فروشی (B2B)","✓ کامل","✓ کامل","👁 فقط مشاهده"],
                ["خرده‌فروشی","✓ کامل","✓ کامل","👁 فقط مشاهده"],
                ["مدیریت سفارشات","✓ کامل","✓ کامل","👁 فقط مشاهده"],
                ["محصولات","✓ کامل","✓ کامل","— دسترسی ندارد"],
                ["ارتباط با مشتری","✓ کامل","✓ کامل","— دسترسی ندارد"],
                ["کنترل دسترسی","✓ کامل","— دسترسی ندارد","— دسترسی ندارد"],
              ].map(([mod,sa,ad,vi],i)=>(
                <tr key={i} style={{ borderBottom:`1px solid ${C.border}`, background:i%2===0?C.surface:C.surfaceAlt }}>
                  <td style={{ padding:"11px 16px", color:C.text, fontWeight:500 }}>{mod}</td>
                  {[sa,ad,vi].map((cell,j)=>{
                    const isOk = cell.startsWith("✓");
                    const isView = cell.startsWith("👁");
                    return (
                      <td key={j} style={{ padding:"11px 20px", textAlign:"center" }}>
                        <span style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:5,
                          background: isOk?C.successDim:isView?C.infoDim:C.surfaceAlt,
                          color: isOk?C.success:isView?C.info:C.textMuted }}>
                          {cell}
                        </span>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* فرم افزودن / ویرایش */}
      {form && (
        <Modal title={editId?"ویرایش کاربر":"کاربر جدید"} onClose={() => { setForm(null); setEditId(null); }} maxWidth={460}>
          <Fld label="نام کامل *">
            <input style={iStyle} value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))} />
          </Fld>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <Fld label="نام کاربری *">
              <input style={iStyle} value={form.username||""} onChange={e=>setForm(f=>({...f,username:e.target.value}))} autoComplete="off" />
            </Fld>
            <Fld label={editId?"رمز جدید (خالی = بدون تغییر)":"رمز عبور *"}>
              <div style={{ position:"relative" }}>
                <input style={{ ...iStyle, paddingLeft:34 }} type={showPw?"text":"password"} value={form.password||""} onChange={e=>setForm(f=>({...f,password:e.target.value}))} autoComplete="new-password" />
                <button onClick={()=>setShowPw(v=>!v)} style={{ position:"absolute", left:8, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", cursor:"pointer", color:C.textDim, fontSize:13 }}>{showPw?"🙈":"👁"}</button>
              </div>
            </Fld>
          </div>
          <Fld label="نقش / سطح دسترسی">
            <select style={{ ...iStyle, cursor:"pointer" }} value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
              <option value="super_admin">مدیر ارشد — دسترسی کامل</option>
              <option value="admin">ادمین — بدون کنترل دسترسی</option>
              <option value="viewer">مشاهده‌گر — فقط خواندن</option>
            </select>
          </Fld>
          <label style={{ display:"flex", alignItems:"center", gap:8, fontSize:13, cursor:"pointer", color:C.text, marginTop:4 }}>
            <input type="checkbox" checked={form.active!==false} onChange={e=>setForm(f=>({...f,active:e.target.checked}))} />
            کاربر فعال باشد
          </label>
          <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:16 }}>
            <Btn label="انصراف" outline onClick={() => { setForm(null); setEditId(null); }} />
            <Btn label={saving?"...":"ذخیره"} icon="check" onClick={save} disabled={saving} />
          </div>
        </Modal>
      )}
    </div>
  );
}
